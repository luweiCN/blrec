<section
  class="site-pulse"
  aria-labelledby="site-pulse-title"
  [attr.aria-busy]="state.kind === 'loading'"
>
  <header class="pulse-label">
    <span class="pulse-dot" aria-hidden="true"></span>
    <h2 id="site-pulse-title">站点动态</h2>
  </header>

  <ng-container *ngIf="stats as currentStats; else statsStatus">
    <dl>
      <div>
        <dt>近 5 分钟</dt>
        <dd>
          <strong>{{ currentStats.activeVisitors | number }}</strong> 人活跃
        </dd>
      </div>
      <div>
        <dt>今日访客</dt>
        <dd><strong>{{ currentStats.today.visitors | number }}</strong> 人</dd>
      </div>
      <div>
        <dt>今日浏览</dt>
        <dd><strong>{{ currentStats.today.pageViews | number }}</strong> 次</dd>
      </div>
      <div>
        <dt>累计浏览</dt>
        <dd><strong>{{ currentStats.totalPageViews | number }}</strong> 次</dd>
      </div>
    </dl>

    <p class="stats-updated">
      约 5 分钟更新 ·
      <time [attr.datetime]="currentStats.generatedAt">
        {{ generatedAtLabel }}
      </time>
    </p>
  </ng-container>

  <ng-template #statsStatus>
    <p class="stats-status" role="status">
      {{
        state.kind === "loading"
          ? "统计载入中"
          : "统计初始化中"
      }}
    </p>
  </ng-template>
</section>
