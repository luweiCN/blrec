<main class="dashboard">
  <header class="site-header">
    <div class="header-primary">
      <a class="brand" routerLink="/" aria-label="虚荣对局榜首页">
        <span class="brand-mark" aria-hidden="true"><span>V</span></span>
        <span class="brand-copy">
          <strong>虚荣对局榜</strong>
          <small>COMMUNITY ARCHIVE</small>
        </span>
      </a>

      <p *ngIf="data.state.kind === 'ready'" class="data-status">
        <span aria-hidden="true"></span>
        <span class="status-season">{{ currentSeasonLabel }}</span>
        <span aria-hidden="true">·</span>
        <span class="status-time">
          <span class="status-prefix">最后同步 </span>{{ lastUpdatedLabel }}
        </span>
      </p>
    </div>

    <div class="header-controls">
      <nav aria-label="榜单页面">
        <a
          routerLink="/"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          总览
        </a>
        <a
          routerLink="/players"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
        >
          玩家排行
        </a>
        <a
          routerLink="/heroes"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
        >
          英雄排行
        </a>
        <a
          routerLink="/guide"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          说明与指南
        </a>
      </nav>

      <app-dashboard-mode-switcher
        class="header-mode"
        [value]="dashboardMode.mode"
        (valueChange)="dashboardMode.selectMode($event)"
      ></app-dashboard-mode-switcher>
    </div>
  </header>

  <router-outlet *ngIf="data.state.kind === 'ready'"></router-outlet>

  <section
    *ngIf="data.state.kind === 'error'"
    class="data-load-error"
    role="alert"
  >
    <p>DATA UNAVAILABLE</p>
    <h1>排行榜数据暂时没有加载成功</h1>
    <p>{{ data.state.message }}</p>
    <button type="button" (click)="data.load()">重新加载</button>
  </section>

  <footer id="method">
    <div>
      <strong>虚荣对局榜</strong>
      <p>赛季按北京时间直播开始时间归档 · 每日发布只读数据快照</p>
      <nav class="footer-links" aria-label="站点说明">
        <a routerLink="/guide/rankings">榜单说明</a>
        <a routerLink="/guide/play">如何游玩</a>
        <a routerLink="/guide/download">下载指南</a>
      </nav>
    </div>
    <p *ngIf="data.snapshotOrNull as snapshot">
      DATA SNAPSHOT / {{ snapshot.publicationDate }}
    </p>
  </footer>
</main>
