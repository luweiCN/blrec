name: Deploy public dashboard

on:
  push:
    branches: [master]
    paths:
      - public-dashboard/**
      - src/blrec/data/vainglory/heroes/**
      - .github/workflows/deploy-public-dashboard.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-dashboard-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, verify and deploy
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: vainglory-dashboard-production
      url: https://vg.luwei.host
    defaults:
      run:
        working-directory: public-dashboard
    env:
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
      OSS_BUCKET: luwei-vainglory
      OSS_ENDPOINT: https://oss-cn-beijing.aliyuncs.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: public-dashboard/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: public-dashboard/deploy/aliyun/site-deploy-requirements.txt

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r deploy/aliyun/site-deploy-requirements.txt

      - name: Test
        run: |
          npm test
          python -m pytest ../tests/vainglory/test_dashboard_site_deploy.py

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Assert that page build contains no dashboard data
        shell: bash
        run: |
          if find dist/data -type f ! -name .gitignore -print -quit 2>/dev/null | grep -q .; then
            echo 'Page deployment must not contain dist/data/**' >&2
            exit 1
          fi

      - name: Deploy page assets to OSS
        run: >-
          python deploy/aliyun/deploy_site.py
          --dist dist
          --endpoint "$OSS_ENDPOINT"
          --bucket "$OSS_BUCKET"

      - name: Verify public endpoint
        working-directory: .
        shell: bash
        run: |
          response_headers="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 4 --retry-all-errors --retry-delay 3 \
            --dump-header "$response_headers" \
            --output /dev/null \
            "https://vg.luwei.host/?deployment=${GITHUB_SHA}"
          grep -qi '^cache-control: .*no-cache' "$response_headers"
