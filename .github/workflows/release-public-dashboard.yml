name: Publish Public Dashboard release

on:
  push:
    tags: ['dashboard-v*.*.*']

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/test-public-dashboard.yml

  publish:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/luweicn/blrec-dashboard-publisher

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: apps/public-dashboard/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Dashboard version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#dashboard-v}"
          site_version="$(node -p "require('./apps/public-dashboard/package.json').version")"
          publisher_version="$(python -c 'import tomllib; print(tomllib.load(open("apps/public-dashboard/publisher/pyproject.toml", "rb"))["project"]["version"])')"
          test "$version" = "$site_version"
          test "$version" = "$publisher_version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build static site artifact
        working-directory: apps/public-dashboard
        run: |
          npm ci
          npm run build
          test -z "$(find dist/data -type f ! -name .gitignore -print -quit 2>/dev/null)"
          cd dist
          zip -qr "../blrec-public-dashboard-${{ steps.version.outputs.value }}.zip" .

      - name: Build Publisher packages
        run: |
          python -m pip install build
          python -m build apps/public-dashboard/publisher

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Publisher image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/public-dashboard/publisher/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE }}:stable
          cache-from: type=gha,scope=dashboard-publisher
          cache-to: type=gha,mode=max,scope=dashboard-publisher

      - name: Create Public Dashboard release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          gh release create "$GITHUB_REF_NAME" \
            "apps/public-dashboard/blrec-public-dashboard-${version}.zip" \
            apps/public-dashboard/publisher/dist/* \
            --verify-tag \
            --generate-notes \
            --prerelease \
            --title "BLREC Public Dashboard ${version}"
