name: One-time migrate Aliyun secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: vainglory-dashboard-production
    steps:
      - name: Copy protected variables to GitLab
        shell: bash
        env:
          GITLAB_API_TOKEN: ${{ secrets.GITLAB_MIGRATION_TOKEN }}
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          test -n "$GITLAB_API_TOKEN"
          test -n "$ALIBABA_CLOUD_ACCESS_KEY_ID"
          test -n "$ALIBABA_CLOUD_ACCESS_KEY_SECRET"

          variables_url='https://code.luwei.host/api/v4/projects/46/variables'
          upsert_variable() {
            key="$1"
            value="$2"
            lookup_status=$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' \
              --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
              "$variables_url/$key")
            case "$lookup_status" in
              200)
                method=PUT
                target_url="$variables_url/$key"
                expected_status=200
                ;;
              404)
                method=POST
                target_url="$variables_url"
                expected_status=201
                ;;
              *)
                printf 'Unexpected lookup status for %s: %s\n' "$key" "$lookup_status" >&2
                exit 1
                ;;
            esac
            write_status=$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' \
              --request "$method" \
              --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
              --form "key=$key" \
              --form "value=$value" \
              --form 'variable_type=env_var' \
              --form 'protected=true' \
              --form 'masked=true' \
              "$target_url")
            test "$write_status" = "$expected_status"
            printf 'Migrated %s\n' "$key"
          }

          upsert_variable ALIBABA_CLOUD_ACCESS_KEY_ID "$ALIBABA_CLOUD_ACCESS_KEY_ID"
          upsert_variable ALIBABA_CLOUD_ACCESS_KEY_SECRET "$ALIBABA_CLOUD_ACCESS_KEY_SECRET"
