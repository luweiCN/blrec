name: Publish Analysis Worker release

on:
  push:
    tags: ['worker-v*.*.*']

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/test-analysis-worker.yml

  publish:
    needs: quality
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Worker version
        working-directory: apps/analysis-worker
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#worker-v}"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$version" = "$package_version"

      - name: Build Worker and shared core packages
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel --outdir apps/analysis-worker/dist/shared-core .
          python -m build --outdir apps/analysis-worker/dist/worker \
            apps/analysis-worker

      - name: Create Analysis Worker release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#worker-v}"
          gh release create "$GITHUB_REF_NAME" \
            apps/analysis-worker/dist/shared-core/* \
            apps/analysis-worker/dist/worker/* \
            apps/analysis-worker/deploy/macos/com.luwei.blrec-analysis-worker.plist.example \
            --verify-tag \
            --generate-notes \
            --prerelease \
            --title "BLREC Analysis Worker ${version}"
