name: Test Analysis Worker

on:
  workflow_dispatch:
  push:
    paths:
      - apps/analysis-worker/**
      - src/blrec/vainglory/**
      - setup.cfg
      - pyproject.toml
      - .github/workflows/test-analysis-worker.yml
  pull_request:
    paths:
      - apps/analysis-worker/**
      - src/blrec/vainglory/**
      - setup.cfg
      - pyproject.toml
      - .github/workflows/test-analysis-worker.yml
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/analysis-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            setup.cfg
            apps/analysis-worker/pyproject.toml

      - name: Install shared core and Worker
        working-directory: .
        run: |
          python -m pip install '.[dev]'
          python - <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          import blrec
          from packaging.version import Version

          project = tomllib.loads(
              Path('apps/analysis-worker/pyproject.toml').read_text(encoding='utf8')
          )['project']
          shared_core = next(
              requirement
              for requirement in project['dependencies']
              if requirement.startswith('blrec==')
          )
          expected_shared_core = 'blrec=={}'.format(Version(blrec.__version__))
          if shared_core != expected_shared_core:
              raise SystemExit(
                  '{} does not match {}'.format(shared_core, expected_shared_core)
              )
          requirements = [
              requirement
              for requirement in project['dependencies']
              if not requirement.startswith('blrec==')
          ]
          requirements.extend(project['optional-dependencies']['test'])
          subprocess.check_call(
              [sys.executable, '-m', 'pip', 'install', *requirements, 'build']
          )
          PY
          python -m pip install --no-deps -e apps/analysis-worker

      - name: Test Worker and analysis engine
        working-directory: .
        run: |
          python -m pytest \
            apps/analysis-worker/tests \
            tests/vainglory/test_analyzer.py \
            tests/vainglory/test_glm_ocr.py \
            tests/vainglory/test_hero_recognition.py \
            tests/vainglory/test_mode_recognition.py \
            tests/vainglory/test_ocr.py \
            tests/vainglory/test_sampling.py \
            tests/vainglory/test_stage_classifier.py \
            tests/vainglory/test_timeline.py \
            tests/vainglory/test_vision.py

      - name: Build Worker packages
        run: python -m build

      - name: Verify Worker wheel contains no mutable model weights
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheel = next(Path('dist').glob('*.whl'))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          models = {Path(name).name for name in names if name.endswith('.onnx')}
          heroes = [name for name in names if '/heroes/' in name and name.endswith('.jpg')]
          assert not models, models
          assert not heroes, heroes
          assert any(name.endswith('/model_package.py') for name in names), names
          PY

      - name: Verify Server source owns no ONNX weights
        working-directory: .
        run: test -z "$(find src/blrec -name '*.onnx' -print -quit)"
