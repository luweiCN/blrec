name: Temporary Harbor secret migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Copy Harbor publisher credentials to GitLab
        shell: bash
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_MIGRATION_TOKEN }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$GITLAB_TOKEN"
          test -n "$HARBOR_USERNAME"
          test -n "$HARBOR_PASSWORD"

          set_variable() {
            key=$1
            value=$2
            masked=$3
            endpoint="https://code.luwei.host/api/v4/projects/46/variables/$key"
            status=$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --request PUT "$endpoint" \
              --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --data-urlencode "value=$value" \
              --data "protected=true" --data "masked=$masked" \
              --data "raw=true" --data-urlencode "environment_scope=*")
            if [[ "$status" == 404 ]]; then
              status=$(curl --silent --show-error --output /dev/null \
                --write-out '%{http_code}' --request POST \
                'https://code.luwei.host/api/v4/projects/46/variables' \
                --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
                --data-urlencode "key=$key" --data-urlencode "value=$value" \
                --data "protected=true" --data "masked=$masked" \
                --data "raw=true" --data-urlencode "environment_scope=*")
            fi
            [[ "$status" == 200 || "$status" == 201 ]]
          }

          set_variable HARBOR_USERNAME "$HARBOR_USERNAME" false
          set_variable HARBOR_PASSWORD "$HARBOR_PASSWORD" true
