name: Publish Vision Lab release

on:
  push:
    tags: ['vision-lab-v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Vision Lab tag to publish to Harbor
        required: true
        type: string
      source_ref:
        description: Git ref containing the source to build
        required: true
        default: master
        type: string

permissions:
  contents: read
  packages: write

jobs:
  quality:
    uses: ./.github/workflows/test-vision-lab.yml

  publish:
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    permissions:
      contents: write
      packages: write
    defaults:
      run:
        working-directory: apps/vision-lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate version
        shell: bash
        run: |
          version="${RELEASE_TAG#vision-lab-v}"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$version" = "$package_version"

      - name: Build
        run: python -m pip install build && python -m build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Harbor for base images
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Publish Vision Lab image
        uses: docker/build-push-action@v6
        with:
          context: apps/vision-lab
          file: apps/vision-lab/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/luweicn/blrec-vision-lab:${{ github.ref_name }}
            ghcr.io/luweicn/blrec-vision-lab:latest

      - name: Create Vision Lab release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${RELEASE_TAG#vision-lab-v}"
          gh release create "$RELEASE_TAG" \
            apps/vision-lab/dist/* \
            apps/vision-lab/deploy/macos/*.plist \
            --verify-tag \
            --generate-notes \
            --prerelease \
            --title "BLREC Vision Lab ${version}"

  publish-harbor:
    if: |
      always() &&
      needs.quality.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success')
    needs: [quality, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref_name }}
      GHCR_IMAGE: ghcr.io/luweicn/blrec-vision-lab
      HARBOR_IMAGE: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/blrec-vision-lab
    defaults:
      run:
        working-directory: apps/vision-lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Validate version
        shell: bash
        run: |
          version="${RELEASE_TAG#vision-lab-v}"
          package_version="$(awk '
            $0 == "[project]" { project = 1; next }
            /^\[/ { project = 0 }
            project && /^version = "/ {
              sub(/^version = "/, "")
              sub(/"$/, "")
              print
              exit
            }
          ' pyproject.toml)"
          test -n "$package_version"
          test "$version" = "$package_version"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.6'
          cache: false

      - name: Build Skopeo
        shell: bash
        run: |
          CGO_ENABLED=0 go install \
            -tags 'exclude_graphdriver_btrfs containers_image_openpgp' \
            github.com/containers/skopeo/cmd/skopeo@v1.17.0
          "$(go env GOPATH)/bin/skopeo" copy --help \
            | grep -q -- '--image-parallel-copies'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Copy Vision Lab image to Harbor
        shell: bash
        run: |
          auth_file="$HOME/.docker/config.json"
          skopeo_bin="$(go env GOPATH)/bin/skopeo"
          test -s "$auth_file"
          test -x "$skopeo_bin"
          copy_image() {
            destination_tag="$1"
            "$skopeo_bin" --override-os linux --override-arch amd64 copy \
              --src-authfile "$auth_file" \
              --dest-authfile "$auth_file" \
              --image-parallel-copies 1 \
              --retry-times 10 \
              --preserve-digests \
              "docker://${GHCR_IMAGE}:${RELEASE_TAG}" \
              "docker://${HARBOR_IMAGE}:${destination_tag}"
          }
          copy_image "$RELEASE_TAG"
          copy_image latest
