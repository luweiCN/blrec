name: Publish Vision Lab release

on:
  push:
    tags: ['vision-lab-v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Vision Lab tag to publish to Harbor
        required: true
        type: string
      source_ref:
        description: Git ref containing the source to build
        required: true
        default: master
        type: string

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/test-vision-lab.yml

  release:
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/vision-lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate version
        shell: bash
        run: |
          version="${RELEASE_TAG#vision-lab-v}"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$version" = "$package_version"

      - name: Build
        run: python -m pip install build && python -m build

      - name: Create Vision Lab release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${RELEASE_TAG#vision-lab-v}"
          gh release create "$RELEASE_TAG" \
            apps/vision-lab/dist/* \
            apps/vision-lab/deploy/macos/*.plist \
            --verify-tag \
            --generate-notes \
            --prerelease \
            --title "BLREC Vision Lab ${version}"

  build-image:
    name: build private Harbor image artifact
    if: |
      always() &&
      needs.quality.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.release.result == 'success')
    needs: [quality, release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload-image.outputs.artifact-id }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref_name }}
      HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
      HARBOR_IMAGE: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/blrec-vision-lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^vision-lab-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$HARBOR_REGISTRY" = 'www.luwei.space:4008'
          version="${RELEASE_TAG#vision-lab-v}"
          package_version="$(awk '
            $0 == "[project]" { project = 1; next }
            /^\[/ { project = 0 }
            project && /^version = "/ {
              sub(/^version = "/, "")
              sub(/"$/, "")
              print
              exit
            }
          ' apps/vision-lab/pyproject.toml)"
          test -n "$package_version"
          test "$version" = "$package_version"

      - name: Prepare image artifact directory
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/vision-lab-image"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to private Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build private Vision Lab image artifact
        uses: docker/build-push-action@v6
        with:
          context: apps/vision-lab
          file: apps/vision-lab/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ env.HARBOR_IMAGE }}:${{ env.RELEASE_TAG }}
          outputs: type=docker,dest=${{ runner.temp }}/vision-lab-image/blrec-vision-lab.tar
          cache-from: type=gha,scope=vision-lab
          cache-to: type=gha,mode=max,scope=vision-lab
          provenance: false

      - name: Create image checksum
        shell: bash
        run: |
          cd "$RUNNER_TEMP/vision-lab-image"
          sha256sum blrec-vision-lab.tar >blrec-vision-lab.tar.sha256

      - name: Upload immutable image artifact
        id: upload-image
        uses: actions/upload-artifact@v4
        with:
          name: vision-lab-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vision-lab-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish-image:
    name: publish private Harbor image
    if: always() && needs.build-image.result == 'success'
    needs: build-image
    runs-on: [self-hosted, linux, x64, blrec-platform]
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref_name }}
      IMAGE_ARTIFACT_ID: ${{ needs.build-image.outputs.artifact-id }}
      HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
      HARBOR_SSH_HOST_KEY: ${{ vars.HARBOR_SSH_HOST_KEY }}
    steps:
      - name: Checkout artifact downloader
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Download immutable image artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apps/vision-lab/deploy/download-actions-artifact.sh \
            "$IMAGE_ARTIFACT_ID" \
            "$RUNNER_TEMP/vision-lab-image" \
            16

      - name: Verify image artifact
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/vision-lab-image"
          sha256sum --check blrec-vision-lab.tar.sha256

      - name: Publish artifact inside Harbor LAN
        shell: bash
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^vision-lab-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$HARBOR_REGISTRY" = 'www.luwei.space:4008'

          remote_host='root@192.168.50.17'
          remote_suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          identity_file='/opt/actions-runner/.ssh/harbor_vision_publish_ed25519'
          image_tar="$RUNNER_TEMP/vision-lab-image/blrec-vision-lab.tar"
          image_size="$(stat --format=%s "$image_tar")"
          [[ "$image_size" =~ ^[0-9]+$ ]]
          test "$image_size" -gt 0
          test "$image_size" -le 2147483648
          local_auth="$(mktemp -d "${RUNNER_TEMP}/blrec-harbor-auth.XXXXXX")"
          known_hosts="$local_auth/known_hosts"
          ssh_options=(
            -o BatchMode=yes
            -o ConnectTimeout=8
            -o IdentitiesOnly=yes
            -i "$identity_file"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts"
          )

          cleanup() {
            ssh "${ssh_options[@]}" "$remote_host" \
              "blrec-vision-publish cleanup $remote_suffix" || true
            rm -rf -- "$local_auth"
          }
          trap cleanup EXIT

          case "$HARBOR_SSH_HOST_KEY" in
            '192.168.50.17 ssh-ed25519 '*) ;;
            *)
              echo 'HARBOR_SSH_HOST_KEY is missing or invalid' >&2
              exit 1
              ;;
          esac
          printf '%s\n' "$HARBOR_SSH_HOST_KEY" >"$known_hosts"
          chmod 600 "$known_hosts"
          test -r "$identity_file"

          ssh "${ssh_options[@]}" "$remote_host" \
            "blrec-vision-publish prepare $remote_suffix"

          HARBOR_CONFIG_PATH="$local_auth/config.json" python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          registry = os.environ['HARBOR_REGISTRY']
          credentials = (
              f"{os.environ['HARBOR_USERNAME']}:"
              f"{os.environ['HARBOR_PASSWORD']}"
          ).encode()
          config = {
              'auths': {
                  registry: {
                      'auth': base64.b64encode(credentials).decode(),
                  },
              },
          }
          path = Path(os.environ['HARBOR_CONFIG_PATH'])
          path.write_text(json.dumps(config), encoding='utf8')
          path.chmod(0o600)
          PY
          ssh "${ssh_options[@]}" "$remote_host" \
            "blrec-vision-publish receive-auth $remote_suffix" \
            <"$local_auth/config.json"

          ssh "${ssh_options[@]}" "$remote_host" \
            "blrec-vision-publish publish $remote_suffix $RELEASE_TAG $image_size" \
            <"$image_tar"
