name: Publish Vision Lab release

on:
  push:
    tags: ['vision-lab-v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  quality:
    uses: ./.github/workflows/test-vision-lab.yml

  publish:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    defaults:
      run:
        working-directory: apps/vision-lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#vision-lab-v}"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$version" = "$package_version"

      - name: Build
        run: python -m pip install build && python -m build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Vision Lab image
        uses: docker/build-push-action@v6
        with:
          context: apps/vision-lab
          file: apps/vision-lab/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/luweicn/blrec-vision-lab:${{ github.ref_name }}
            ghcr.io/luweicn/blrec-vision-lab:latest

      - name: Create Vision Lab release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#vision-lab-v}"
          gh release create "$GITHUB_REF_NAME" \
            apps/vision-lab/dist/* \
            --verify-tag \
            --generate-notes \
            --prerelease \
            --title "BLREC Vision Lab ${version}"
