name: Publish Vision Lab release

on:
  push:
    tags: ['vision-lab-v*.*.*']

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/test-vision-lab.yml

  publish:
    needs: quality
    runs-on: macos-15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/vision-lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Validate version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#vision-lab-v}"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$version" = "$package_version"

      - name: Build
        run: python -m pip install build && python -m build

      - name: Create Vision Lab release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#vision-lab-v}"
          gh release create "$GITHUB_REF_NAME" \
            apps/vision-lab/dist/* \
            --verify-tag \
            --generate-notes \
            --prerelease \
            --title "BLREC Vision Lab ${version}"
