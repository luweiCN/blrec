name: Publish Vision Lab release

on:
  push:
    tags: ['vision-lab-v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Vision Lab tag to publish to Harbor
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  quality:
    uses: ./.github/workflows/test-vision-lab.yml

  publish:
    needs: quality
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      HARBOR_IMAGE: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/blrec-vision-lab
    permissions:
      contents: write
      packages: write
    defaults:
      run:
        working-directory: apps/vision-lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate version
        shell: bash
        run: |
          version="${RELEASE_TAG#vision-lab-v}"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$version" = "$package_version"

      - name: Build
        run: python -m pip install build && python -m build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Publish Vision Lab image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: apps/vision-lab
          file: apps/vision-lab/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/luweicn/blrec-vision-lab:${{ github.ref_name }}
            ghcr.io/luweicn/blrec-vision-lab:latest
            ${{ env.HARBOR_IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.HARBOR_IMAGE }}:latest

      - name: Backfill Vision Lab image to Harbor
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: apps/vision-lab
          file: apps/vision-lab/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.HARBOR_IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.HARBOR_IMAGE }}:latest

      - name: Create Vision Lab release
        if: github.event_name == 'push'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${RELEASE_TAG#vision-lab-v}"
          gh release create "$RELEASE_TAG" \
            apps/vision-lab/dist/* \
            apps/vision-lab/deploy/macos/*.plist \
            --verify-tag \
            --generate-notes \
            --prerelease \
            --title "BLREC Vision Lab ${version}"
