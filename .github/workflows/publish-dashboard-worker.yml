name: Publish dashboard worker image

on:
  push:
    branches: [master]
    paths:
      - Dockerfile.dashboard-publisher
      - setup.cfg
      - pyproject.toml
      - src/blrec/vainglory/dashboard_publisher.py
      - src/blrec/vainglory/dashboard_snapshot.py
      - src/blrec/vainglory/dashboard_rating.py
      - src/blrec/networking/**
      - src/blrec/setting/**
      - .github/workflows/publish-dashboard-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-worker-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/luweicn/blrec

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.dashboard-publisher
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=dashboard-${{ github.sha }}
            REVISION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:dashboard-publisher-master
            ${{ env.IMAGE }}:dashboard-publisher-${{ github.sha }}
          cache-from: type=gha,scope=dashboard-publisher
          cache-to: type=gha,mode=max,scope=dashboard-publisher
