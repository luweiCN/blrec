name: Publish dashboard worker image

on:
  push:
    branches: [master]
    paths:
      - apps/public-dashboard/publisher/**
      - src/blrec/networking/**
      - src/blrec/logging/**
      - src/blrec/utils/string.py
      - .github/workflows/publish-dashboard-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-worker-image
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/test-public-dashboard.yml

  publish:
    needs: quality
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/luweicn/blrec-dashboard-publisher

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/public-dashboard/publisher/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=dashboard-${{ github.sha }}
            REVISION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:master
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=dashboard-publisher
          cache-to: type=gha,mode=max,scope=dashboard-publisher
