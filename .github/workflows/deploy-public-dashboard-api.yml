name: Deploy public dashboard API

on:
  push:
    branches: [master]
    paths:
      - apps/public-dashboard/api/**
      - apps/public-dashboard/publisher/src/blrec_dashboard_publisher/deduplication.py
      - apps/public-dashboard/publisher/src/blrec_dashboard_publisher/rating.py
      - apps/public-dashboard/publisher/src/blrec_dashboard_publisher/snapshot.py
      - .github/workflows/deploy-public-dashboard-api.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-dashboard-api-production
  cancel-in-progress: false

jobs:
  build:
    name: Test and build API release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      DASHBOARD_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/blrec_dashboard_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: blrec_dashboard_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blrec_dashboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/public-dashboard/api/pyproject.toml
            apps/public-dashboard/api/deploy/runtime-requirements.txt

      - name: Install test and build dependencies
        run: |
          python -m pip install \
            -r apps/public-dashboard/api/deploy/runtime-requirements.txt \
            'httpx>=0.23.0,<0.24.0' \
            'pytest>=7.4.4,<9.0.0' \
            build
          python -m pip install --no-deps -e apps/public-dashboard/publisher
          python -m pip install --no-deps -e apps/public-dashboard/api

      - name: Test API and rating contract
        run: >-
          python -m pytest
          apps/public-dashboard/api/tests
          apps/public-dashboard/publisher/tests/test_rating.py

      - name: Build offline release
        shell: bash
        run: |
          python -m build apps/public-dashboard/publisher
          python -m build apps/public-dashboard/api
          release_root="$(mktemp -d)"
          mkdir -p "$release_root/wheels" "$release_root/wheelhouse" "$release_root/deploy"
          cp apps/public-dashboard/publisher/dist/*.whl "$release_root/wheels/"
          cp apps/public-dashboard/api/dist/*.whl "$release_root/wheels/"
          cp apps/public-dashboard/api/deploy/runtime-requirements.txt "$release_root/"
          cp apps/public-dashboard/api/deploy/blrec-dashboard-api.service "$release_root/deploy/"
          cp apps/public-dashboard/api/deploy/vg-api.luwei.host.nginx.conf "$release_root/deploy/"
          python -m pip download \
            --only-binary=:all: \
            --dest "$release_root/wheelhouse" \
            --requirement apps/public-dashboard/api/deploy/runtime-requirements.txt
          tar --create --gzip --file dashboard-api-release.tgz -C "$release_root" .

      - name: Upload immutable release
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-api-release
          path: dashboard-api-release.tgz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy API on PVE
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: [self-hosted, linux, x64, blrec-platform]
    environment:
      name: vainglory-dashboard-production
      url: https://vg-api.luwei.host/v1/health

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Download immutable release
        uses: actions/download-artifact@v4
        with:
          name: dashboard-api-release

      - name: Install release on PVE
        shell: bash
        run: |
          sudo -n bash apps/public-dashboard/api/deploy/install-release.sh \
            "$PWD/dashboard-api-release.tgz" \
            "${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Verify public endpoint
        run: |
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --retry 5 --retry-all-errors --retry-delay 3 \
            https://vg-api.luwei.host/v1/health
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 120 \
            --retry 5 --retry-all-errors --retry-delay 3 \
            --output /dev/null \
            https://vg-api.luwei.host/v1/dashboard
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --retry 5 --retry-all-errors --retry-delay 3 \
            --output /dev/null \
            https://vg-api.luwei.host/v2/dashboard/summary
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --retry 5 --retry-all-errors --retry-delay 3 \
            --output /dev/null \
            https://vg-api.luwei.host/v1/matches/summary
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --retry 5 --retry-all-errors --retry-delay 3 \
            --output /dev/null \
            https://vg-api.luwei.host/v1/live-rooms
