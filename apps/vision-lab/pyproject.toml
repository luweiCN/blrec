[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blrec-vision-lab"
version = "0.3.59"
description = "Local data collection, labeling, dataset and model training workbench for BLREC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pexpect>=4.9",
  "pillow>=10.0",
  "numpy>=1.26",
  "onnxruntime>=1.20",
  "opencv-python>=4.8",
  "loguru>=0.7,<0.8",
  "psycopg[binary,pool]>=3.2,<3.3",
]

[project.optional-dependencies]
train = ["ultralytics>=8.3"]
test = ["pytest>=8.0"]

[project.scripts]
blrec-vision-lab = "labeler.server:main"
blrec-vision-media = "labeler.media_server:main"
blrec-vision-worker = "labeler.vision_worker:main"
blrec-vision-backfill-material-index = "labeler.backfill_material_index:main"
blrec-vision-migrate-candidate-inbox = "labeler.migrate_candidate_inbox:main"
blrec-vision-backup = "labeler.database_backup:main"
blrec-vision-migrate-postgres = "labeler.database_migrate:main"
blrec-vision-restore = "labeler.database_restore:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["labeler*"]

[tool.setuptools.package-data]
labeler = ["static/*", "resources/heroes/*.jpg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
