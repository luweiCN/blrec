[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blrec-analysis-worker"
version = "0.1.28"
description = "Mac analysis worker for BLREC Vainglory recordings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "blrec==3.0.0b133",
  "loguru>=0.7.2,<0.8.0",
  "requests>=2.24.0,<3.0.0",
  "rapidocr==3.9.2",
  "onnxruntime==1.23.2; python_version == '3.10'",
  "onnxruntime==1.28.0; python_version >= '3.11'",
  "opencv-python>=4.8.0.76,<4.12.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4.4,<9.0.0"]

[project.scripts]
blrec-analysis-worker = "blrec_analysis_worker.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
