services:
  dashboard-publisher:
    image: ghcr.io/luweicn/blrec-dashboard-publisher:${DASHBOARD_PUBLISHER_IMAGE_TAG:-master}
    pull_policy: missing
    container_name: blrec-dashboard-publisher
    network_mode: host
    restart: unless-stopped
    env_file:
      - ${DASHBOARD_PUBLISHER_ENV_FILE:-/volume1/docker/blrec-next/secrets/dashboard-publisher.env}
    environment:
      PYTHONPATH: /app
      TZ: ${TZ:-Asia/Shanghai}
      BLREC_CONFIG: /cfg/settings.toml
      DASHBOARD_DATABASE: /cfg/blrec.sqlite3
      DASHBOARD_STATE: /state
      DASHBOARD_RESULT_FRAMES: /result-frames
      DASHBOARD_API_URL: ${DASHBOARD_API_URL:-https://vg-api.luwei.host}
      DASHBOARD_STATIC_JSON_ENABLED: ${DASHBOARD_STATIC_JSON_ENABLED:-false}
      DASHBOARD_PUBLIC_DATA_BASE_URL: ${DASHBOARD_PUBLIC_DATA_BASE_URL:-https://vg.luwei.host/data}
      OSS_ENDPOINT: https://oss-cn-beijing.aliyuncs.com
      OSS_BUCKET: luwei-vainglory
      OSS_PREFIX: data
      DASHBOARD_WATCH_SECONDS: ${DASHBOARD_WATCH_SECONDS:-1}
      DASHBOARD_DEBOUNCE_SECONDS: ${DASHBOARD_DEBOUNCE_SECONDS:-2}
      DASHBOARD_RECONCILE_SECONDS: ${DASHBOARD_RECONCILE_SECONDS:-86400}
      DASHBOARD_RETRY_SECONDS: ${DASHBOARD_RETRY_SECONDS:-60}
    volumes:
      - ${BLREC_CONFIG_DIR:-/volume1/docker/blrec-next/config}:/cfg:ro
      - ${DASHBOARD_PUBLISHER_STATE_DIR:-/volume1/docker/blrec-next/dashboard-publisher/state}:/state
      - ${VAINGLORY_RESULT_FRAMES_DIR:-/volume1/docker/blrec-next/vainglory-result-frames}:/result-frames:ro
