<main class="dashboard">
  <header class="site-header">
    <a class="brand" routerLink="/" aria-label="虚荣对局榜首页">
      <span class="brand-mark" aria-hidden="true"><span>V</span></span>
      <span class="brand-copy">
        <strong>虚荣对局榜</strong>
        <small>COMMUNITY ARCHIVE</small>
      </span>
    </a>

    <nav class="primary-nav" aria-label="榜单页面">
      <a
        routerLink="/"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        总览
      </a>
      <a
        routerLink="/players"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <span class="nav-label-long">玩家榜</span>
        <span class="nav-label-short">玩家</span>
      </a>
      <a
        routerLink="/heroes"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <span class="nav-label-long">英雄榜</span>
        <span class="nav-label-short">英雄</span>
      </a>
      <a
        routerLink="/matches"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        对局
      </a>
      <a
        routerLink="/guide/rankings"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <span class="nav-label-long">榜单说明</span>
        <span class="nav-label-short">榜单</span>
      </a>
      <a
        class="game-guide-link"
        routerLink="/guide/download"
        [class.active]="isGameGuideActive"
        [attr.aria-current]="isGameGuideActive ? 'page' : null"
      >
        <span class="nav-label-long">下载与游玩</span>
        <span class="nav-label-short">下载游玩</span>
      </a>
    </nav>

    <app-dashboard-mode-switcher
      class="header-mode"
      [value]="dashboardMode.mode"
      (valueChange)="dashboardMode.selectMode($event)"
    ></app-dashboard-mode-switcher>

    <p
      *ngIf="data.state.kind === 'ready'"
      class="data-status"
      [class.refreshing]="realtimeRefreshState === 'refreshing'"
      [class.updated]="realtimeRefreshState === 'updated'"
      [attr.aria-busy]="realtimeRefreshState === 'refreshing'"
      role="status"
      aria-live="polite"
    >
      <span aria-hidden="true"></span>
      <span [class.status-season]="realtimeRefreshState === 'idle'">
        {{ dashboardStatusLabel }}
      </span>
    </p>
    <p *ngIf="data.state.kind === 'loading'" class="data-status loading">
      <span aria-hidden="true"></span>
      <span>数据载入中</span>
    </p>
  </header>

  <section
    *ngIf="data.state.kind === 'loading'"
    class="dashboard-loading"
    aria-label="正在加载排行榜"
    aria-busy="true"
  >
    <div class="dashboard-loading-hero" aria-hidden="true"></div>
    <div class="dashboard-loading-grid" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="dashboard-loading-table" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </section>

  <router-outlet *ngIf="data.state.kind === 'ready'"></router-outlet>

  <section
    *ngIf="data.state.kind === 'error'"
    class="data-load-error"
    role="alert"
  >
    <p>DATA UNAVAILABLE</p>
    <h1>排行榜数据暂时没有加载成功</h1>
    <p>{{ data.state.message }}</p>
    <button type="button" (click)="reloadDashboard()">重新加载</button>
  </section>

  <footer id="method">
    <app-site-stats [state]="siteStatsState"></app-site-stats>

    <div class="footer-meta">
      <div>
        <strong>虚荣对局榜</strong>
        <p>赛季按北京时间直播开始时间归档 · 检测到新数据后更新榜单</p>
        <nav class="footer-links" aria-label="站点说明">
          <a routerLink="/guide/rankings">榜单说明</a>
          <a routerLink="/guide/play">如何游玩</a>
          <a routerLink="/guide/download">下载指南</a>
        </nav>
      </div>
      <p *ngIf="data.snapshotOrNull as snapshot">
        DATA SNAPSHOT / {{ snapshot.publicationDate }}
      </p>
    </div>
  </footer>
</main>
