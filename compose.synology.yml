services:
  blrec-next:
    image: ghcr.io/luweicn/blrec-server:${BLREC_SERVER_IMAGE_TAG:-3.0.0-beta.83}
    pull_policy: always
    container_name: blrec-next
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 2m
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      BLREC_ADMIN_USERNAME: ${BLREC_ADMIN_USERNAME:?请设置管理员用户名}
      BLREC_API_KEY: ${BLREC_API_KEY:?请设置初始化安全码}
      BLREC_FORWARDED_ALLOW_IPS: ${BLREC_FORWARDED_ALLOW_IPS:-127.0.0.1}
      BLREC_CREDENTIAL_KEY_FILE: /cfg/credential.key
      BLREC_VAINGLORY_RESULT_FRAME_ROOT: /result-frames
      BLREC_VAINGLORY_WORKER_MODE: ${BLREC_VAINGLORY_WORKER_MODE:-remote}
      BLREC_ANALYSIS_WORKER_TOKEN: ${BLREC_ANALYSIS_WORKER_TOKEN:-}
      BLREC_CLOUD_COST_ALIYUN_ACCESS_KEY_ID: ${BLREC_CLOUD_COST_ALIYUN_ACCESS_KEY_ID:-}
      BLREC_CLOUD_COST_ALIYUN_ACCESS_KEY_SECRET: ${BLREC_CLOUD_COST_ALIYUN_ACCESS_KEY_SECRET:-}
      BLREC_CLOUD_COST_ALIYUN_CDN_DOMAIN: ${BLREC_CLOUD_COST_ALIYUN_CDN_DOMAIN:-vg.luwei.host}
      BLREC_CLOUD_COST_ALIYUN_OSS_BUCKET: ${BLREC_CLOUD_COST_ALIYUN_OSS_BUCKET:-luwei-vainglory}
      BLREC_CLOUD_COST_ALIYUN_OSS_ENDPOINT: ${BLREC_CLOUD_COST_ALIYUN_OSS_ENDPOINT:-oss-cn-beijing.aliyuncs.com}
      BLREC_CLOUD_COST_ALIYUN_OSS_REGION: ${BLREC_CLOUD_COST_ALIYUN_OSS_REGION:-cn-beijing}
      BLREC_CLOUD_COST_CACHE_SECONDS: ${BLREC_CLOUD_COST_CACHE_SECONDS:-600}
      BLREC_VISITOR_ANALYTICS_ALIYUN_ACCESS_KEY_ID: ${BLREC_VISITOR_ANALYTICS_ALIYUN_ACCESS_KEY_ID:-}
      BLREC_VISITOR_ANALYTICS_ALIYUN_ACCESS_KEY_SECRET: ${BLREC_VISITOR_ANALYTICS_ALIYUN_ACCESS_KEY_SECRET:-}
      BLREC_VISITOR_ANALYTICS_SLS_ENDPOINT: ${BLREC_VISITOR_ANALYTICS_SLS_ENDPOINT:-cn-beijing.log.aliyuncs.com}
      BLREC_VISITOR_ANALYTICS_SLS_PROJECT: ${BLREC_VISITOR_ANALYTICS_SLS_PROJECT:-vainglory}
      BLREC_VISITOR_ANALYTICS_SLS_LOGSTORE: ${BLREC_VISITOR_ANALYTICS_SLS_LOGSTORE:-vainglory-dashboard}
      BLREC_VISITOR_ANALYTICS_DOMAIN: ${BLREC_VISITOR_ANALYTICS_DOMAIN:-vg.luwei.host}
      BLREC_VISITOR_ANALYTICS_CACHE_SECONDS: ${BLREC_VISITOR_ANALYTICS_CACHE_SECONDS:-300}
      BLREC_VISITOR_ANALYTICS_RETENTION_DAYS: ${BLREC_VISITOR_ANALYTICS_RETENTION_DAYS:-7}
    volumes:
      - ${BLREC_CONFIG_DIR:-/volume1/docker/blrec-next/config}:/cfg
      - ${BLREC_LOG_DIR:-/volume1/docker/blrec-next/log}:/log
      - ${BLREC_RECORDING_DIR:-/volume1/docker/blrec-next/rec}:/rec
      - ${BLREC_FAVORITES_DIR:-/volume1/docker/blrec-next/favorites}:/favorites
      - ${BLREC_CLIP_DIR:-/volume1/docker/blrec-next/clips}:/clips
      - ${BLREC_VAINGLORY_RESULT_FRAME_DIR:-/volume1/docker/blrec-next/vainglory-result-frames}:/result-frames
